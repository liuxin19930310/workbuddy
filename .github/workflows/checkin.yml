name: WorkBuddy Daily Checkin

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC，北京时间 = UTC + 8
    # 以下 5 个时点对应北京时间 09:00 / 12:00 / 15:00 / 18:00 / 21:00
    # 多时点触发 + 幂等逻辑：任一时刻成功领取即可，不会重复领分
    - cron: '0 1,4,7,10,13 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制推送一条微信通知（用于验证 SERVERCHAN_KEY 配置是否正确）'
        type: boolean
        default: false

# contents: write 供「每月心跳提交」步骤使用，用于防止 GitHub 在仓库长期无提交时停用定时任务
permissions:
  contents: write

# 同一时刻只允许一个实例，避免并发重复请求
concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 使用 Node 24 原生版本，避免 "Node.js 20 is deprecated" 警告
      # （checkout v5 / setup-python v6 是各自第一个 Node 24 版本，行为差异最小）
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run WorkBuddy checkin
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_DOMAIN: www.codebuddy.cn
          # 可选：填 Server 酱 SendKey 可推送微信；不需要则删除下面这行
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # 推送级别：action = 只在领取成功 / 出错时推（当前设置，每天最多 1 条，
          #            即「签到成功 +100 积分」；「今日已签到」这类巡检不推）
          #           all    = 每次巡检都推（每天 5 条，含无动作的巡检结果）
          # 注：降频到 action 后每天 ≤1 条，也顺带避开了 Server 酱免费版约 5 条/天的额度上限
          PUSH_LEVEL: action
          # 手动触发时勾选 force_notify=true，可强制推一条，用于验证推送配置。
          # 用 github.event.inputs 而非 inputs：inputs 上下文仅在 workflow_dispatch /
          # workflow_call 可用，定时(schedule)触发时其值为 null 且 inputs 段的 default 不生效，
          # 而定时触发恰恰是本任务的主要运行方式。
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: python checkin.py

      # 本仓库只承载这一个自动化，长期无提交会被 GitHub 自动停用定时任务。
      # 该步骤每月写入一次心跳文件并提交，确保仓库始终有活动；失败不影响签到结果。
      #
      # 注意：schedule / workflow_dispatch 触发的运行，actions/checkout 会以 detached HEAD
      # 检出提交，此时裸 `git push` 会报 "You are not currently on a branch" 而静默失败
      # （本步骤是 continue-on-error，不会让 job 变红，所以必须显式指定目标分支）。
      - name: Keep repository active (monthly heartbeat commit)
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          mkdir -p .keepalive
          STAMP=".keepalive/last-heartbeat.txt"
          THIS_MONTH="$(date +%Y-%m)"
          if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$THIS_MONTH" ]; then
            echo "Heartbeat already updated this month: $THIS_MONTH"
            exit 0
          fi
          echo "$THIS_MONTH" > "$STAMP"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STAMP"
          git commit -m "chore: monthly heartbeat ${THIS_MONTH}"
          git push origin HEAD:main
