name: WorkBuddy Daily Checkin

# 🚨 部署前必读：免费个人账号下，**私有仓库的 schedule 事件不会触发**（官方文档未记载）。
#    本仓库必须是 public（或账号有 GitHub Pro），否则下面这些 cron 一次都不会跑。
#    判定：Actions 页只有手动运行记录、零条 schedule 运行；工作流页横幅只提 workflow_dispatch。
#    详见 SKILL.md 的「🚨 头号坑」。

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC，北京时间 = UTC + 8
    # 以下 5 个时点对应北京时间 09:00 / 12:00 / 15:00 / 18:00 / 21:00
    # 多时点触发 + 幂等逻辑：任一时刻成功领取即可，不会重复领分
    - cron: '0 1,4,7,10,13 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制推送一条微信通知（用于验证 SERVERCHAN_KEY 配置是否正确）'
        type: boolean
        default: false

# contents: write 供「每日运行戳」步骤提交使用（证明定时触发确实发生了，兼做保活）
permissions:
  contents: write

# 同一时刻只允许一个实例，避免并发重复请求
concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 使用 Node 24 原生版本，避免 "Node.js 20 is deprecated" 警告
      # （checkout v5 / setup-python v6 是各自第一个 Node 24 版本，行为差异最小）
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run WorkBuddy checkin
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_DOMAIN: www.codebuddy.cn
          # 推送渠道：serverchan = 微信（Server 酱；免费额度仅约 5 条/天，不宜配 all）
          #           bark       = iPhone 原生通知（无条数限制，推荐）
          # 不设本项时默认 serverchan —— 既有部署无需改动
          NOTIFY_CHANNEL: serverchan
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # 改用 Bark：NOTIFY_CHANNEL 改成 bark，并加一行
          #   BARK_KEY: ${{ secrets.BARK_KEY }}
          # （BARK_KEY 可填 App 首页那串 key，或整条测试 URL；另有 BARK_SERVER / BARK_GROUP / BARK_LEVEL 可选）
          # 推送级别：action = 只在领取成功 / 出错时推（默认，每天最多 1 条）
          #           all    = 每次巡检都推（含「今日已签到」这类无动作结果，每天 5 条）
          #           off    = 本仓不推送（什么都不推，也不产生告警注解）
          # 关掉推送：本行改为 off，并顺手删掉上面的密钥行
          PUSH_LEVEL: action
          # 手动触发时勾选 force_notify=true，可强制推一条，用于验证推送配置。
          # 用 github.event.inputs 而非 inputs：inputs 上下文仅在 workflow_dispatch /
          # workflow_call 可用，定时(schedule)触发时其值为 null 且 inputs 段的 default 不生效，
          # 而定时触发恰恰是本任务的主要运行方式。
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        id: run_checkin
        run: |
          # 输出落盘，供下一步的运行戳提取本次 action；最后以脚本自身的退出码结束本步骤，
          # 所以加了这段逻辑也不会把脚本的失败吞成成功。
          python checkin.py > "$RUNNER_TEMP/wb-checkin.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/wb-checkin.log"
          ACTION="$(sed -n 's/.*"action": *"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/wb-checkin.log" | head -1)"
          echo "action=${ACTION:-unknown}" >> "$GITHUB_OUTPUT"
          exit ${rc:-0}

      # 每日「运行戳」：把当天「第一笔运行」和当天出现过的实质动作记录进一个文件并提交。
      #
      # 为什么需要它：积分到账在仓库里看不见，本自动化又没有别的远端副作用，
      # 于是「今天到底跑没跑、被谁触发、结果是什么」从外部无从判断。这个文件就是
      # **不需要任何 API 就能读的账本**：
      #   有今天的戳   = 今天确实跑过
      #   event=...    = 触发来源（schedule = GitHub 原生定时；workflow_dispatch = 外部定时器或手动）
      #   action=...   = 本次结果（claimed / departed = 有实质动作；skip_* = 空跑；none / error = 异常）
      #
      # 门控规则：
      #   当天还没有戳                                → 写入（哪怕空跑或出错，先留下「跑过」的证据）
      #   当天已有戳 + 本次是实质动作且与已记录的不同 → 覆盖（travel 当天会先 departed 后 claimed，各记一笔）
      #   其余情况                                    → 保持原样
      #
      # 与旧版的区别：旧版是「schedule 覆盖一切」，目的是证明原生定时跑了；但主触发源改为
      # 外部定时器后（走 workflow_dispatch），旧规则会把 00:05 的领取记录覆盖成 09:xx 的空跑，
      # 反而掩盖真相。两个 workflow 仍各用独立文件，避免互相挡住。
      #
      # 注意：schedule / workflow_dispatch 触发时 actions/checkout 处于 detached HEAD，
      # 裸 `git push` 会报 "You are not currently on a branch" 而静默失败
      # （本步骤是 continue-on-error，不会让 job 变红），所以必须显式写 HEAD:main。
      - name: Daily run stamp (event + action ledger)
        # if: always() —— 脚本报错时也要留下「今天跑过、结果是 error」的记录，
        # 否则出错日反而毫无痕迹（旧版正是如此）。
        if: always()
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
          ACTION: ${{ steps.run_checkin.outputs.action }}
        run: |
          set -e
          mkdir -p .keepalive
          STAMP=".keepalive/last-run-checkin.txt"
          TODAY="$(date +%Y-%m-%d)"
          if [ -f "$STAMP" ] && [ "$(cut -d' ' -f1 "$STAMP")" = "$TODAY" ]; then
            case "${ACTION}" in
              claimed|departed)
                if grep -q "action=${ACTION}" "$STAMP"; then
                  echo "already recorded action=${ACTION} today:"; cat "$STAMP"; exit 0
                fi
                ;;
              *)
                echo "no new meaningful action (action=${ACTION}); keep:"; cat "$STAMP"; exit 0
                ;;
            esac
          fi
          echo "$(date '+%Y-%m-%d %H:%M:%S %z') checkin event=${GITHUB_EVENT_NAME} action=${ACTION:-unknown}" > "$STAMP"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STAMP"
          git commit -m "chore: daily run stamp ${TODAY} (checkin)"
          git push origin HEAD:main
