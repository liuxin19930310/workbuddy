name: Qoder CN Daily Credits

# 每天领取两个 Qoder CN 账号各 100 通用 Credits（活动 UTC+8 10:00 刷新，无补领）。
# 令牌来自仓库 Secret，与本机登录态解耦 —— 电脑不用开机。
#   QODER_TOKEN      = 18716238521（867177378@qq.com，主号，本机登录态）
#   QODER_TOKEN_MAIN = 15376833948（备用号，无备份，token 到 2026-12-20）
# 令牌过期需本机重新登录对应账号后写回 Secret（见 skill qoder-checkin）。
#
# 推送沿用仓库现有 BARK_KEY（iPhone 原生通知，无 Server 酱的 5 条/天限制）。
# 只在真领到 / 出错时推送，已领过（ALREADY）静默，避免一天 5 次刷屏。

on:
  schedule:
    # GitHub cron 用 UTC，北京时间 = UTC + 8。
    # 5 个时点对应北京 10:05 / 11:05 / 15:05 / 19:05 / 23:05，
    # 兜住「10:05 活动未下发 / 刚开机网络未就绪」。领取幂等，不会重复发。
    - cron: '5 2,3,7,11,15 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制推送一条通知（验证 BARK_KEY / token 是否可用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qoder-credits
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: 'Qoder 主号 18716238521'
            token_secret: 'QODER_TOKEN'
          - label: 'Qoder 备号 15376833948'
            token_secret: 'QODER_TOKEN_MAIN'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Claim Qoder Credits (${{ matrix.label }})
        env:
          QODER_TOKEN: ${{ secrets[matrix.token_secret] }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
          ACCOUNT_LABEL: ${{ matrix.label }}
          SECRET_NAME: ${{ matrix.token_secret }}
        run: |
          EXTRA=""
          if [ "$FORCE_NOTIFY" = "true" ]; then EXTRA="$EXTRA --force-notify"; fi
          python qoder_claim.py --label "$ACCOUNT_LABEL" --secret "$SECRET_NAME" $EXTRA
